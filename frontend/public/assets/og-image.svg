<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="cyanGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#06080E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1626" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#080D17" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="#06080E" />
  <circle cx="600" cy="300" r="450" fill="url(#cyanGlow)" />

  <!-- Grid lines -->
  <g opacity="0.1" stroke="#06B6D4" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- Central Card -->
  <rect x="140" y="85" width="920" height="460" rx="24" fill="url(#cardGrad)" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Breadcrumbs Bar -->
  <g transform="translate(180, 140)">
    <text font-family="monospace" font-size="14" fill="#38BDF8" letter-spacing="1">✦ ARFA DANIAL / PORTFOLIO › CYBERSECURITY SUITE › PHISHGUARD</text>
  </g>

  <!-- Badge -->
  <g transform="translate(180, 175)">
    <rect width="210" height="32" rx="16" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#38BDF8" />
    <text x="34" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#38BDF8" letter-spacing="1">AI THREAT INTEL v1.2</text>
  </g>

  <!-- Title & Icon -->
  <g transform="translate(180, 260)">
    <!-- Shield icon -->
    <circle cx="36" cy="32" r="32" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1.5" />
    <path d="M36 17L22 23v10c0 8.5 6 15.5 14 17.5 8-2 14-9 14-17.5V23L36 17z" fill="#06B6D4" fill-opacity="0.3" stroke="#38BDF8" stroke-width="2" />
    <path d="M36 27v7M36 39.5v.5" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    
    <text x="90" y="44" font-family="sans-serif" font-size="46" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">PHISHGUARD</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(180, 335)">
    <text font-family="sans-serif" font-size="20" fill="#E2E8F0" font-weight="500">AI Phishing Threat Intelligence &amp; URL Classification Engine</text>
    <text y="30" font-family="sans-serif" font-size="15" fill="#94A3B8">Lexical Entropy • WHOIS/DNS Cross-Inspection • Real-time NLP Spear-Phishing Detection</text>
  </g>

  <!-- Live Telemetry Pill Badges -->
  <g transform="translate(180, 420)">
    <rect width="180" height="42" rx="10" fill="#1E293B" stroke="#334155" />
    <text x="18" y="26" font-family="monospace" font-size="13" fill="#38BDF8">● Real-time Telemetry</text>

    <rect x="200" width="190" height="42" rx="10" fill="#1E293B" stroke="#334155" />
    <text x="218" y="26" font-family="monospace" font-size="13" fill="#10B981">⚡ 99.4% Accuracy</text>

    <rect x="410" width="180" height="42" rx="10" fill="#1E293B" stroke="#334155" />
    <text x="428" y="26" font-family="monospace" font-size="13" fill="#FBBF24">🔍 Multi-Vector Scans</text>
  </g>

  <!-- URL Tag -->
  <text x="920" y="510" text-anchor="end" font-family="monospace" font-size="14" fill="#64748B">phishingdetector-nyzxis.vercel.app</text>
</svg>
